<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<meta name="theme-color" content="#3182f6">
<!--SEO-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /*
    시작 템플릿 메인 페이지.
    - 이 페이지에는 제휴 링크를 넣지 않습니다. 제휴 상품은 모두 offers.html 에서 관리합니다.
    - 중괄호 두 개로 감싼 자리표시는 tools/build.py 가 site.json 값으로 바꿉니다.
  */
  :root {
    --bg: #f2f4f6; --card: #ffffff; --text: #191f28; --sub: #4e5968; --muted: #8b95a1;
    --line: #e5e8eb; --soft: #f9fafb;
    --blue: #3182f6; --blue-press: #1b64da; --blue-soft: #e8f3ff; --blue-text: #1b64da;
    --shadow: 0 2px 12px rgba(0, 27, 55, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101013; --card: #1c1c21; --text: #f2f3f5; --sub: #c3c8cf; --muted: #8b95a1;
      --line: #2c2c34; --soft: #24242b;
      --blue: #4d94ff; --blue-press: #3182f6; --blue-soft: #1a2a45; --blue-text: #8bb8ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
  .hero { padding: 36px 4px 8px; }
  .eyebrow { display: inline-block; font-size: 13px; font-weight: 700; color: var(--blue-text);
    background: var(--blue-soft); padding: 4px 10px; border-radius: 99px; margin-bottom: 12px; }
  h1 { font-size: clamp(26px, 7vw, 34px); line-height: 1.3; margin: 0 0 10px; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--blue); }
  .lead { color: var(--sub); margin: 0; font-size: 16px; }
  .card { background: var(--card); border-radius: 22px; padding: 22px; margin-top: 16px; box-shadow: var(--shadow); }
  h2 { font-size: 19px; font-weight: 800; margin: 0 0 14px; letter-spacing: -0.03em; }
  .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .menu a { background: var(--soft); border-radius: 14px; padding: 16px 14px; text-decoration: none; color: var(--text);
    font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .menu a:hover { background: var(--line); }
  .cta { display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700;
    border-radius: 14px; padding: 15px 16px; background: var(--blue); color: #fff; margin-top: 16px; }
  .cta:hover { background: var(--blue-press); }
  .faq details { border-top: 1px solid var(--line); }
  .faq details:first-of-type { border-top: 0; }
  .faq summary { list-style: none; cursor: pointer; font-weight: 700; padding: 16px 28px 16px 0; position: relative; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: ""; position: absolute; right: 4px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
  .faq details[open] summary::after { transform: rotate(-135deg); margin-top: -2px; }
  .faq details p { margin: 0 0 16px; color: var(--sub); font-size: 15px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="eyebrow">{{EYEBROW}}</span>
    <h1>{{HEADLINE_1}}<br><em>{{HEADLINE_2}}</em></h1>
    <p class="lead">{{TAGLINE}}</p>
  </header>

  <!-- 여기에 이 사이트의 핵심 기능(계산기, 체크리스트, 랭킹 등)을 넣습니다 -->
  <section class="card">
    <h2>핵심 기능 자리</h2>
    <p class="lead">이 카드를 사이트의 주 기능으로 바꾸세요.</p>
    <a class="cta" href="/offers">추천 모음 보기</a>
  </section>

  <section class="card">
    <h2>무엇이 필요하세요?</h2>
    <div class="menu">
      <a href="/offers?c=quote"><span>📝</span>무료 견적 비교</a>
      <a href="/offers?c=shop"><span>🛒</span>추천 준비물</a>
    </div>
  </section>

  <section class="card faq">
    <h2>자주 묻는 질문</h2>
    <details><summary>질문 1</summary><p>답변 1. 검색 유입을 위해 사람들이 실제로 검색하는 질문으로 채우세요.</p></details>
    <details><summary>질문 2</summary><p>답변 2.</p></details>
  </section>

  <footer>
    본 페이지는 일반적인 정보를 정리한 참고 자료입니다.<br>
    일부 연결 페이지에는 제휴 링크가 포함되어 있으며, 이를 통해 운영자가 수수료를 받을 수 있습니다.
  </footer>
</div>
</body>
</html>
